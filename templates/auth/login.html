{% extends "base.html" %}

{% block title %}Sign In — SafePath AI{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card sp-card p-4 p-md-5 shadow-sm">
        <div class="text-center mb-4">
          <div class="logo-badge mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.4rem;">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <h3 class="fw-bold">Sign In to SafePath AI</h3>
          <p class="text-muted small">Access your personal safety dashboard & trusted contacts</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label small fw-bold"><i class="fa-solid fa-envelope text-primary me-1"></i>Email Address</label>
            <input type="email" name="email" id="loginEmail" class="form-control" placeholder="you@example.com" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold"><i class="fa-solid fa-lock text-primary me-1"></i>Password</label>
            <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
              <label class="form-check-label small text-muted" for="rememberMe">
                Remember me
              </label>
            </div>
            <a href="{{ url_for('main.about') }}#privacy" class="small text-muted text-decoration-none">Privacy rules</a>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary-teal py-2">
              <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In
            </button>
          </div>
        </form>

        <!-- 1-Click Quick Fill for Demo Testing -->
        <div class="p-3 bg-light rounded-3 border text-center small mb-3">
          <span class="d-block text-muted fw-semibold mb-2">Instant Demo Accounts (Click to Fill):</span>
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-xs btn-outline-secondary py-1" onclick="quickFill('demo@safepath.ai', 'safepath123')">
              <i class="fa-solid fa-user me-1"></i>Demo User
            </button>
            <button type="button" class="btn btn-xs btn-outline-warning py-1" onclick="quickFill('admin@safepath.ai', 'admin123')">
              <i class="fa-solid fa-shield me-1"></i>Admin User
            </button>
          </div>
        </div>

        <div class="text-center small text-muted">
          Don't have an account? 
          <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Register Free</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function quickFill(email, pwd) {
    document.getElementById("loginEmail").value = email;
    document.getElementById("loginPassword").value = pwd;
  }
</script>
{% endblock %}
